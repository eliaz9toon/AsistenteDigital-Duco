x-duco-database: &duco-database
  ORACLE_USER: DUCO_APP
  ORACLE_PASSWORD: ${DUCO_DOCKER_APP_PASSWORD:?Define DUCO_DOCKER_APP_PASSWORD en el .env de la raiz}
  ORACLE_DSN: oracle:1521/FREEPDB1

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${DUCO_DOCKER_SYS_PASSWORD:?Define DUCO_DOCKER_SYS_PASSWORD en el .env de la raiz}
      APP_USER: DUCO_APP
      APP_USER_PASSWORD: ${DUCO_DOCKER_APP_PASSWORD:?Define DUCO_DOCKER_APP_PASSWORD en el .env de la raiz}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/oracle:/duco-sql:ro
      - ./docker/init-oracle.sh:/container-entrypoint-initdb.d/01-duco.sh:ro
    ports:
      - "127.0.0.1:11521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_ORIGINS: "http://127.0.0.1:8765,http://localhost:8765"
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-model:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen3.5:4b"]
    depends_on:
      ollama:
        condition: service_healthy

  duco:
    build: .
    environment:
      <<: *duco-database
      ADMIN_HOST: "0.0.0.0"
      ADMIN_PORT: "8765"
      DUCO_OLLAMA_URL: http://ollama:11434
    depends_on:
      oracle:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/api/duco/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: docker/Dashboard.Dockerfile
    environment: *duco-database
    depends_on:
      oracle:
        condition: service_healthy
    ports:
      - "127.0.0.1:6080:6080"

volumes:
  oracle-data:
  ollama-models:
