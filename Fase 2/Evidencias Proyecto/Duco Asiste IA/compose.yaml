services:
  duco:
    build: .
    env_file: admin-app/.env
    environment:
      ADMIN_HOST: "0.0.0.0"
      ADMIN_PORT: "8765"
      ORACLE_DSN: ${DUCO_DOCKER_ORACLE_DSN:-host.docker.internal:1521/FREEPDB1}
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/api/duco/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
